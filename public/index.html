<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylight Sneaker Co.</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Archivo+Black&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#0E0E0E;font-family:Archivo,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none;cursor:pointer}
a:hover{color:#0E0E0E}
input,select,button,textarea{font:inherit;color:inherit}
::selection{background:#E6FF00;color:#0E0E0E}
img{display:block;max-width:100%}
.wrap{max-width:1440px;margin:0 auto;position:relative}
.top-bar{background:#F5F5F5;display:flex;justify-content:space-between;align-items:center;padding:8px 40px;font-size:13px;color:#4A4A48;font-weight:500}
.top-bar a{cursor:pointer}
.top-bar a:hover{text-decoration:underline}
.top-links{display:flex;gap:20px}
.nav{display:flex;align-items:center;gap:36px;padding:0 40px;height:66px;border-bottom:1px solid #EDEDED;position:sticky;top:0;background:#fff;z-index:40}
.nav-logo{font-family:'Archivo Black',Archivo,sans-serif;font-size:22px;letter-spacing:-.035em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center}
.nav-links{display:flex;gap:24px;font-size:14px;font-weight:700}
.nav-links a{padding:22px 0;cursor:pointer}
.nav-links a.sale{color:#E01E00}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search-box{display:flex;align-items:center;gap:8px;background:#F5F5F5;border-radius:999px;padding:9px 16px;width:210px}
.search-box input{border:0;background:none;outline:none;font-size:13px;width:100%}
.bag-btn{background:#0E0E0E;color:#fff;border:0;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer}
.hero{position:relative;height:620px;overflow:hidden;background:#1a1a1a}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.68) 0%,rgba(10,10,10,.2) 46%,rgba(10,10,10,0) 68%)}
.hero-content{position:absolute;left:40px;bottom:56px;max-width:620px;color:#fff}
.hero-content .sub{font-size:15px;font-weight:600;margin-bottom:14px;color:rgba(255,255,255,.9)}
.hero-content h1{font-family:'Archivo Black',Archivo,sans-serif;font-size:clamp(52px,7vw,104px);line-height:.84;letter-spacing:-.05em;text-transform:uppercase}
.hero-content p{margin:20px 0 0;font-size:17px;line-height:1.5;max-width:42ch;color:rgba(255,255,255,.9)}
.hero-btns{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn-white{background:#fff;color:#0E0E0E;border-radius:999px;padding:15px 26px;font-size:14px;font-weight:700;border:0;cursor:pointer;display:inline-block}
.btn-glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:15px 26px;font-size:14px;font-weight:700;display:inline-block}
.banner{background:#E6FF00;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.banner b{font-size:15px;font-weight:800}
.banner a{font-size:14px;font-weight:700;border-bottom:2px solid #0E0E0E;padding-bottom:2px;cursor:pointer}
.section{padding:56px 40px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.section-head h2{font-family:'Archivo Black',Archivo,sans-serif;font-size:30px;letter-spacing:-.035em;text-transform:uppercase}
.section-head a{font-size:14px;font-weight:700;border-bottom:1.5px solid #0E0E0E;padding-bottom:2px;cursor:pointer}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat-card{position:relative;display:block;background:#F5F5F5;height:330px;overflow:hidden;cursor:pointer}
.cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.25,1)}
.cat-card:hover img{transform:scale(1.05)}
.cat-card span{position:absolute;left:18px;bottom:18px;background:#0E0E0E;color:#fff;padding:11px 18px;font-size:14px;font-weight:800}
.tile{display:block;cursor:pointer}
.tile-img{aspect-ratio:1/1;overflow:hidden;position:relative;background:#F5F5F5}
.tile-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.25,1)}
.tile:hover .tile-img img{transform:scale(1.04)}
.tile-tag{position:absolute;top:12px;left:12px;padding:5px 10px;font-size:12px;font-weight:700}
.tile-info{padding-top:13px}
.tile-model{font-size:15px;font-weight:800}
.tile-color{font-size:14px;color:#6E6C66;margin-top:2px}
.tile-stock{font-size:13px;color:#93938C;margin-top:7px}
.tile-price{display:flex;align-items:baseline;gap:8px;margin-top:7px}
.tile-price .now{font-size:15px;font-weight:700}
.tile-price .was{font-size:13px;color:#A3A39C;text-decoration:line-through}
.member-block{background:#0E0E0E;color:#fff;display:grid;grid-template-columns:1fr 1fr}
.member-left{padding:46px 40px}
.member-left .label{font-size:15px;font-weight:600;color:#E6FF00}
.member-left h2{margin:14px 0 0;font-family:'Archivo Black',Archivo,sans-serif;font-size:clamp(30px,4vw,50px);line-height:.88;letter-spacing:-.04em;text-transform:uppercase}
.member-left p{margin:16px 0 0;font-size:16px;line-height:1.55;color:#A5A39E;max-width:42ch}
.member-right{border-left:1px solid #212121;padding:46px 40px;display:flex;flex-direction:column;gap:18px}
.step-num{font-size:14px;font-weight:700;color:#E6FF00;padding-top:2px}
.step-title{font-size:16px;font-weight:800}
.step-body{margin:5px 0 0;font-size:14px;line-height:1.55;color:#A5A39E}
.btn-lime{background:#E6FF00;color:#0E0E0E;border:0;border-radius:999px;padding:15px 26px;font-size:14px;font-weight:800;cursor:pointer;display:inline-block}
.btn-outline{border:1px solid #3A3A3A;border-radius:999px;padding:15px 26px;font-size:14px;font-weight:700;color:#fff;background:none;cursor:pointer;display:inline-block}
.breadcrumb{font-size:14px;color:#8B8983;padding:34px 40px 0}
.breadcrumb a{cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.page-title{margin:14px 0 0;font-family:'Archivo Black',Archivo,sans-serif;font-size:42px;letter-spacing:-.04em;text-transform:uppercase;padding:0 40px}
.page-sub{margin:8px 0 0;font-size:15px;color:#6E6C66;padding:0 40px}
.list-head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;padding:0 40px;flex-wrap:wrap;gap:12px}
.list-head h1{font-family:'Archivo Black',Archivo,sans-serif;font-size:42px;letter-spacing:-.04em;text-transform:uppercase}
.sort-wrap{display:flex;align-items:center;gap:10px}
.sort-wrap span{font-size:14px;color:#6E6C66}
.sort-wrap select{border:1px solid #DEDEDE;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;background:#fff}
.chips{display:flex;gap:8px;margin-top:22px;padding:0 40px;flex-wrap:wrap}
.chip{border:1px solid #DEDEDE;background:#fff;color:#0E0E0E;border-radius:999px;padding:10px 17px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:#0E0E0E;color:#fff;border-color:#0E0E0E}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;padding:0 40px}
.empty-state{border:1px solid #EDEDED;padding:56px;text-align:center;margin:22px 40px 0}
.empty-state h3{font-size:20px;font-weight:800}
.empty-state p{margin:8px auto 20px;font-size:15px;color:#6E6C66;max-width:44ch}
.pdp{padding:34px 40px 0}
.pdp-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;margin-top:18px}
.pdp-hero{aspect-ratio:4/3;position:relative;overflow:hidden;background:#F5F5F5}
.pdp-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pdp-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pdp-thumb{width:92px;height:74px;padding:0;position:relative;overflow:hidden;cursor:pointer;background:#F5F5F5}
.pdp-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pdp-brand{font-size:14px;color:#8B8983;font-weight:600}
.pdp-model{margin:6px 0 0;font-family:'Archivo Black',Archivo,sans-serif;font-size:38px;line-height:1;letter-spacing:-.035em;text-transform:uppercase}
.pdp-colorway{font-size:16px;color:#6E6C66;margin-top:6px}
.pdp-price{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.pdp-price .now{font-size:24px;font-weight:800}
.pdp-price .was{font-size:16px;color:#A3A39C;text-decoration:line-through}
.pdp-price .tag{font-size:13px;font-weight:700;padding:5px 10px}
.size-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:28px}
.size-head span{font-size:15px;font-weight:800}
.size-head a{font-size:14px;color:#6E6C66;text-decoration:underline;cursor:pointer}
.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.size-btn{border:1.5px solid #DEDEDE;background:#fff;color:#0E0E0E;padding:14px 0;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.size-btn.on{background:#0E0E0E;color:#fff;border-color:#0E0E0E}
.size-btn.gone{color:#BEBEB8;text-decoration:line-through;cursor:not-allowed}
.size-hint{font-size:14px;margin-top:10px}
.btn-full{width:100%;margin-top:20px;background:#0E0E0E;color:#fff;border:0;border-radius:999px;padding:17px;font-size:15px;font-weight:800;cursor:pointer}
.btn-full-outline{width:100%;margin-top:10px;background:#fff;border:1.5px solid #0E0E0E;border-radius:999px;padding:16px;font-size:15px;font-weight:700;cursor:pointer}
.facts{margin-top:26px;border-top:1px solid #EDEDED}
.fact{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #EDEDED;font-size:14px}
.fact .k{color:#6E6C66}
.fact .v{font-weight:700;text-align:right}
.pdp-notes{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px;padding-top:26px;border-top:1px solid #EDEDED}
.pdp-note h4{font-size:16px;font-weight:800}
.pdp-note p{margin:6px 0 0;font-size:14px;line-height:1.55;color:#6E6C66}
.checkout-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;margin-top:26px;padding:0 40px}
.form-section{font-size:18px;font-weight:800;margin-top:30px}
.form-section:first-child{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.form-label{display:block}
.form-label span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.form-label input{width:100%;border:1.5px solid #DEDEDE;padding:14px;font-size:15px;outline:none;background:#fff}
.form-label input.err{border-color:#E01E00}
.form-label .error{display:block;font-size:13px;color:#E01E00;margin-top:5px;min-height:18px}
.span-2{grid-column:span 2}
.option-btn{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;border:1.5px solid #DEDEDE;background:#fff;padding:16px;cursor:pointer;width:100%}
.option-btn.on{border-color:#0E0E0E;background:#F7F7F5}
.option-btn .title{display:block;font-size:15px;font-weight:800}
.option-btn .body{display:block;font-size:14px;color:#6E6C66;margin-top:3px}
.option-btn .cost{font-size:15px;font-weight:800;white-space:nowrap}
.option-btn .note{font-size:14px;font-weight:700;color:#6E6C66;white-space:nowrap}
.order-summary{border:1px solid #EDEDED;padding:22px}
.order-summary h3{font-size:18px;font-weight:800}
.summary-items{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.summary-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.summary-item .thumb{background:#F5F5F5;height:52px;position:relative;overflow:hidden}
.summary-item .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.summary-item .name{font-size:14px;font-weight:800}
.summary-item .meta{font-size:13px;color:#6E6C66}
.summary-item .price{font-size:14px;font-weight:700}
.summary-totals{margin-top:18px;padding-top:14px;border-top:1px solid #EDEDED;display:flex;flex-direction:column;gap:9px;font-size:14px}
.summary-row{display:flex;justify-content:space-between}
.summary-row .label{color:#6E6C66}
.summary-row .value{font-weight:700}
.summary-total{display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid #EDEDED;font-size:17px;font-weight:800}
.confirm-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;padding:34px 40px 0}
.confirm-badge{display:inline-block;background:#E6FF00;padding:7px 13px;font-size:14px;font-weight:800}
.confirm-title{margin:16px 0 0;font-family:'Archivo Black',Archivo,sans-serif;font-size:clamp(32px,4vw,52px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}
.confirm-body{margin:16px 0 0;font-size:16px;line-height:1.6;color:#54524D;max-width:52ch}
.confirm-details{margin-top:34px;border-top:1px solid #EDEDED;padding-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.confirm-details h4{font-size:15px;font-weight:800}
.confirm-details p{margin:6px 0 0;font-size:14px;line-height:1.55;color:#6E6C66;white-space:pre-line}
.wa-preview{background:#0E0E0E;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:400px}
.wa-header{display:flex;align-items:center;gap:9px;font-size:13px;color:#8B8983;font-weight:600}
.wa-dot{width:8px;height:8px;border-radius:50%;background:#25D366}
.wa-msg{background:#25D366;color:#0B2F17;border-radius:16px 16px 16px 5px;padding:15px 17px;font-size:14px;line-height:1.65;white-space:pre-line}
.wa-reply{align-self:flex-end;background:#242424;color:#DDDBD5;border-radius:16px 16px 5px 16px;padding:13px 16px;font-size:14px;max-width:80%}
.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:24px;padding:0 40px}
.track-input{display:flex;gap:10px}
.track-input input{flex:1;border:1.5px solid #DEDEDE;padding:15px;font-size:15px;outline:none}
.track-input button{background:#0E0E0E;color:#fff;border:0;padding:15px 24px;font-size:14px;font-weight:800;cursor:pointer}
.timeline-step{display:grid;grid-template-columns:22px 1fr;gap:16px}
.timeline-dot{display:flex;flex-direction:column;align-items:center}
.timeline-dot .dot{width:14px;height:14px;border-radius:50%}
.timeline-dot .line{flex:1;width:2px;min-height:48px}
.timeline-body{padding-bottom:22px}
.timeline-body h4{font-size:16px;font-weight:800}
.timeline-body .when{font-size:14px;color:#8B8983;margin-top:3px}
.timeline-body p{margin:6px 0 0;font-size:14px;line-height:1.55;color:#6E6C66;max-width:44ch}
.track-sidebar{background:#F5F5F5;padding:24px}
.track-sidebar h3{font-size:18px;font-weight:800}
.track-sidebar p{margin:8px 0 0;font-size:15px;line-height:1.6;color:#54524D}
.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:26px;padding:0 40px}
.help-card{border-top:2px solid #0E0E0E;padding-top:16px}
.help-card .k{font-size:14px;color:#8B8983;font-weight:600}
.help-card h3{font-size:20px;font-weight:800;margin-top:6px}
.help-card p{margin:8px 0 0;font-size:15px;line-height:1.6;color:#54524D;max-width:52ch}
.help-cta{margin:34px 40px 0;background:#F5F5F5;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.help-cta h3{font-size:20px;font-weight:800}
.help-cta p{margin:6px 0 0;font-size:15px;color:#54524D;max-width:56ch}
.footer{margin-top:56px;background:#0E0E0E;color:#fff;padding:44px 40px 26px}
.footer-grid{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:30px;padding-bottom:30px;border-bottom:1px solid #212121}
.footer-col h4{font-size:14px;color:#6E6C66;font-weight:600;margin-bottom:13px}
.footer-col a{display:block;font-size:14px;color:#C9C7C2;margin-bottom:9px;cursor:pointer}
.footer-col a:hover{color:#fff}
.footer-brand{font-family:'Archivo Black',Archivo,sans-serif;font-size:32px;letter-spacing:-.04em;text-transform:uppercase}
.footer-brand p{margin:10px 0 0;font-size:14px;line-height:1.6;color:#8B8983;max-width:30ch;font-family:Archivo,sans-serif;font-weight:400;letter-spacing:0;text-transform:none}
.footer-bottom{display:flex;justify-content:space-between;padding-top:18px;font-size:13px;color:#6E6C66;flex-wrap:wrap;gap:8px}
.bag-overlay{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:60}
.bag-drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#fff;z-index:70;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.bag-header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid #EDEDED}
.bag-header h3{font-size:20px;font-weight:800}
.bag-close{border:0;background:none;font-size:24px;cursor:pointer}
.bag-body{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:16px}
.bag-item{display:grid;grid-template-columns:78px 1fr;gap:14px;padding-bottom:16px;border-bottom:1px solid #F0F0F0}
.bag-item .thumb{background:#F5F5F5;height:66px;position:relative;overflow:hidden}
.bag-item .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bag-item .details{display:flex;justify-content:space-between;gap:10px}
.bag-item .name{font-size:15px;font-weight:800}
.bag-item .meta{font-size:13px;color:#6E6C66;margin-top:2px}
.bag-item .price{font-size:15px;font-weight:700}
.bag-item .actions{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty-ctrl{display:flex;align-items:center;border:1px solid #DEDEDE}
.qty-ctrl button{border:0;background:none;padding:6px 11px;font-size:15px;cursor:pointer}
.qty-ctrl span{font-size:14px;font-weight:700;min-width:18px;text-align:center}
.remove-btn{border:0;background:none;font-size:13px;color:#8B8983;text-decoration:underline;cursor:pointer;padding:0}
.bag-footer{border-top:1px solid #EDEDED;padding:18px 22px 22px}
.bag-empty{padding:40px 0;text-align:center}
.bag-empty h3{font-size:17px;font-weight:800}
.bag-empty p{margin:8px 0 18px;font-size:14px;color:#6E6C66}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0E0E0E;color:#fff;padding:14px 22px;font-size:14px;font-weight:600;z-index:90;box-shadow:0 18px 40px rgba(0,0,0,.25);white-space:nowrap;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.hidden{display:none!important}
@media(max-width:1024px){
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-4,.product-grid{grid-template-columns:repeat(2,1fr)}
  .pdp-grid{grid-template-columns:1fr}
  .checkout-grid{grid-template-columns:1fr}
  .confirm-grid{grid-template-columns:1fr}
  .track-grid{grid-template-columns:1fr}
  .help-grid{grid-template-columns:1fr}
  .member-block{grid-template-columns:1fr}
  .member-right{border-left:0;border-top:1px solid #212121}
  .footer-grid{grid-template-columns:repeat(2,1fr)}
  .hero{height:480px}
  .hero-content h1{font-size:64px}
}
@media(max-width:640px){
  .top-bar{padding:8px 16px;font-size:12px;gap:8px}
  .top-bar,.nav,.section,.breadcrumb,.page-title,.page-sub,.list-head,.chips,.product-grid,.checkout-grid,.confirm-grid,.track-grid,.help-grid,.help-cta,.pdp,.banner{padding-left:16px;padding-right:16px}
  .nav{gap:10px;padding:0 16px;height:50px}
  .nav-logo{font-size:18px;flex-shrink:0}
  .nav-links{display:none}
  .search-box{display:none}
  .nav-right{gap:8px;flex-shrink:0;margin-left:auto}
  .nav-right a{display:none}
  .bag-btn{padding:9px 14px;font-size:12px;flex-shrink:0}
  .grid-3,.grid-4,.product-grid{grid-template-columns:repeat(2,1fr)}
  .size-grid{grid-template-columns:repeat(3,1fr)}
  .pdp-model{font-size:28px}
  .page-title{font-size:28px}
  .hero{height:400px}
  .hero-content h1{font-size:48px}
  .hero-content{left:16px;bottom:32px;max-width:calc(100vw - 32px)}
  .hero-content p{font-size:15px}
  .footer{padding:30px 16px 20px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:20px}
  .confirm-details{grid-template-columns:1fr}
  .bag-drawer{width:100vw}
  .form-grid{grid-template-columns:1fr}
  .span-2{grid-column:span 1}
  .chips{gap:6px}
  .chip{padding:8px 12px;font-size:13px}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const R = n => 'R' + n.toLocaleString('en-ZA').replace(/,/g,' ');
const thumb = f => `/img/thumb/${f}`;
const medium = thumb;

let STATE = {
  view: 'home',
  memberView: 'join',
  memberForm: { name:'', phone:'', email:'' },
  memberDone: false,
  products: [],
  config: { freeOver: 2500, courier: 120, waNumber: '27820000000', stripeEnabled: false },
  filter: 'All',
  sort: 'Newest first',
  query: '',
  productId: null,
  productDetail: null,
  shotIndex: 0,
  size: null,
  bag: [],
  bagOpen: false,
  delivery: 'courier',
  payment: 'eft',
  form: { name:'', phone:'', address:'', city:'', postcode:'', note:'' },
  errors: {},
  orderRef: null,
  orderData: null,
  waUrl: null,
  trackRef: '',
  trackResult: null,
  trackNote: 'Use the reference from your confirmation, or ask in the chat and we will find it.',
};

function go(view, extra) {
  Object.assign(STATE, { view, bagOpen: false }, extra || {});
  window.scrollTo(0, 0);
  if (view === 'home' || view === 'list') STATE.productDetail = null;
  render();
  updateHash();
}

function updateHash() {
  const v = STATE.view;
  if (v === 'home') history.replaceState(null, '', '#');
  else if (v === 'list') history.replaceState(null, '', '#shop');
  else if (v === 'product' && STATE.productId) history.replaceState(null, '', '#product/' + STATE.productId);
  else if (v === 'checkout') history.replaceState(null, '', '#checkout');
  else if (v === 'confirm' && STATE.orderRef) history.replaceState(null, '', '#confirm/' + STATE.orderRef);
  else if (v === 'track') history.replaceState(null, '', '#track');
  else if (v === 'help') history.replaceState(null, '', '#help');
  else if (v === 'membership') history.replaceState(null, '', '#membership');
}

function flash(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.classList.remove('show'), 2600);
}

async function loadProducts() {
  const res = await fetch('/api/products');
  STATE.products = await res.json();
}

async function loadConfig() {
  const res = await fetch('/api/config');
  STATE.config = await res.json();
}

async function loadProduct(id) {
  const res = await fetch(`/api/products/${id}`);
  if (!res.ok) return null;
  return res.json();
}

function filtered() {
  let list = STATE.products;
  const f = STATE.filter;
  if (f === 'Men') list = list.filter(p => p.gender === 'Men' || p.gender === 'Unisex');
  else if (f === 'Women') list = list.filter(p => p.gender === 'Women' || p.gender === 'Unisex');
  else if (f === 'Reduced') list = list.filter(p => p.was);
  else if (f === 'Under R3 000') list = list.filter(p => p.price < 3000);
  else if (f === 'Nike') list = list.filter(p => p.brand === 'Nike');
  else if (f === 'adidas') list = list.filter(p => p.brand === 'adidas');
  else if (f === 'New Balance') list = list.filter(p => p.brand === 'New Balance');
  else if (f === 'Puma') list = list.filter(p => p.brand === 'Puma');
  else if (f === 'Sizes 9+') list = list.filter(p => p.sizes.includes(9));
  if (STATE.query.trim()) {
    const q = STATE.query.toLowerCase();
    list = list.filter(p => `${p.brand} ${p.model} ${p.colorway}`.toLowerCase().includes(q));
  }
  if (STATE.sort === 'Price: low to high') list = [...list].sort((a, b) => a.price - b.price);
  if (STATE.sort === 'Price: high to low') list = [...list].sort((a, b) => b.price - a.price);
  return list;
}

function subtotal() {
  return STATE.bag.reduce((n, i) => {
    const p = STATE.products.find(x => x.id === i.id);
    return n + (p ? p.price : 0) * i.qty;
  }, 0);
}

function deliveryCost() {
  return subtotal() >= STATE.config.freeOver ? 0 : STATE.config.courier;
}

function bagCount() {
  return STATE.bag.reduce((n, i) => n + i.qty, 0);
}

function addToBag() {
  if (!STATE.size) { flash('Pick a UK size first'); return; }
  const id = STATE.productId;
  const bag = [...STATE.bag];
  const hit = bag.findIndex(i => i.id === id && i.size === STATE.size);
  if (hit > -1) bag[hit] = { ...bag[hit], qty: bag[hit].qty + 1 };
  else bag.push({ id, size: STATE.size, qty: 1 });
  STATE.bag = bag;
  STATE.bagOpen = true;
  const p = STATE.productDetail || STATE.products.find(x => x.id === id);
  flash(`${p.model} UK ${STATE.size} added`);
  render();
}

function qtyChange(ix, d) {
  const bag = [...STATE.bag];
  const next = bag[ix].qty + d;
  if (next < 1) bag.splice(ix, 1);
  else bag[ix] = { ...bag[ix], qty: next };
  STATE.bag = bag;
  render();
}

function removeBag(ix) {
  STATE.bag.splice(ix, 1);
  render();
}

async function openProduct(id) {
  STATE.productId = id;
  STATE.shotIndex = 0;
  STATE.size = null;
  STATE.productDetail = await loadProduct(id);
  STATE.view = 'product';
  window.scrollTo(0, 0);
  render();
  updateHash();
}

async function placeOrder() {
  const f = STATE.form;
  const errors = {};
  if (!f.name.trim()) errors.name = 'We need a name for the courier';
  if (!/[0-9]{9,}/.test(f.phone.replace(/\D/g, ''))) errors.phone = 'A working mobile number, please';
  if (!f.address.trim()) errors.address = 'Street address is required';
  if (!f.city.trim()) errors.city = 'Which city?';
  STATE.errors = errors;
  if (Object.keys(errors).length) { flash('A few details are missing'); render(); return; }

  const items = STATE.bag.map(i => ({ productId: i.id, size: i.size, qty: i.qty }));
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: f.name, phone: f.phone, address: f.address, city: f.city,
        postcode: f.postcode, note: f.note,
        delivery: STATE.delivery, payment: STATE.payment, items
      })
    });
    const data = await res.json();
    if (!res.ok) { flash(data.error || 'Something went wrong'); return; }

    STATE.orderRef = data.ref;
    STATE.orderData = data;
    STATE.trackRef = data.ref;

    if (STATE.payment === 'card' && STATE.config.stripeEnabled) {
      const sRes = await fetch('/api/checkout/stripe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderRef: data.ref })
      });
      const sData = await sRes.json();
      if (sData.url) { window.location.href = sData.url; return; }
    }

    STATE.waUrl = data.waUrl;
    STATE.bag = [];
    saveBag();
    if (data.waUrl) {
      window.location.href = data.waUrl;
    } else {
      go('confirm', { orderRef: data.ref });
    }
  } catch (err) {
    flash('Network error — try again');
  }
}

function tileHTML(p, size) {
  const tagColors = { 'Reduced': ['#E01E00','#fff'], 'Low stock': ['#E6FF00','#0E0E0E'] };
  const [tagBg, tagInk] = tagColors[p.tag] || ['#0E0E0E','#fff'];
  const priceColor = p.was ? '#E01E00' : '#0E0E0E';
  const imgSize = size || 'thumb';
  return `<a class="tile" onclick="openProduct(${p.id})">
    <div class="tile-img">
      <img src="/img/${imgSize}/${p.image}" alt="${p.model}" loading="lazy">
      <span class="tile-tag" style="background:${tagBg};color:${tagInk}">${p.tag}</span>
    </div>
    <div class="tile-info">
      <div class="tile-model">${p.model}</div>
      <div class="tile-color">${p.colorway}</div>
      <div class="tile-stock">${p.sizes.length} UK sizes left</div>
      <div class="tile-price">
        <span class="now" style="color:${priceColor}">${R(p.price)}</span>
        ${p.was ? `<span class="was">${R(p.was)}</span>` : ''}
      </div>
    </div>
  </a>`;
}

function waMessage() {
  const lines = STATE.bag.map(i => {
    const p = STATE.products.find(x => x.id === i.id);
    if (!p) return '';
    return `• ${p.brand} ${p.model} — ${p.colorway}\n  UK ${i.size} ×${i.qty}  ${R(p.price * i.qty)}`;
  }).join('\n');
  const f = STATE.form;
  const sub = subtotal();
  const del = deliveryCost();
  const payNote = `\n\nPayment: EFT — I'll send proof of payment shortly.\nPlease use ref ${STATE.orderRef || 'pending'} to match my payment.`;
  return `Hi Daylight! I'd like to order:\n\n${lines}\n\nSubtotal: ${R(sub)}\nCourier: ${del ? R(del) : 'Free'}\nTotal: ${R(sub + del)}${payNote}\n\nName: ${f.name || '—'}\nContact: ${f.phone || '—'}\nAddress: ${[f.address, f.city, f.postcode].filter(Boolean).join(', ')}\nRef: ${STATE.orderRef || 'pending'}`;
}

function render() {
  const app = $('#app');
  const s = STATE;
  const bc = bagCount();
  const sub = subtotal();
  const del = deliveryCost();
  const total = sub + del;

  let html = '';

  // Top bar
  html += `<div class="top-bar">
    <div class="top-links"><a onclick="go('help')">Delivery &amp; returns</a><a onclick="go('track')">Track my order</a></div>
    <div class="top-links"><span>South Africa</span><a href="https://wa.me/27659662508?text=Hi%20Daylight!" target="_blank">Talk to us on WhatsApp</a></div>
  </div>`;

  // Nav
  html += `<div class="nav">
    <a class="nav-logo" onclick="go('home')"><img src="/logo/logo-on-light.png" alt="Daylight Sneaker Co." style="height:48px"></a>
    <div class="nav-links">
      <a onclick="go('list',{filter:'All'})">New in</a>
      <a onclick="go('list',{filter:'Men'})">Men</a>
      <a onclick="go('list',{filter:'Women'})">Women</a>
      <a onclick="go('list',{filter:'All'})">Brands</a>
      <a class="sale" onclick="go('list',{filter:'Reduced'})">Sale</a>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <span style="color:#93938C;font-size:14px">&#x2315;</span>
        <input id="searchInput" placeholder="Search sneakers" value="${s.query}" oninput="STATE.query=this.value;if(this.value)STATE.view='list';render()">
      </div>
      <a onclick="go('track')" style="font-size:13px;font-weight:700">Orders</a>
      <button class="bag-btn" onclick="STATE.bagOpen=true;render()">Bag (${bc})</button>
    </div>
  </div>`;

  // Views
  if (s.view === 'home') html += renderHome();
  else if (s.view === 'list') html += renderList();
  else if (s.view === 'product') html += renderProduct();
  else if (s.view === 'checkout') html += renderCheckout();
  else if (s.view === 'confirm') html += renderConfirm();
  else if (s.view === 'track') html += renderTrack();
  else if (s.view === 'help') html += renderHelp();
  else if (s.view === 'membership') html += renderMembership();

  // Footer
  html += renderFooter();

  // Bag drawer
  if (s.bagOpen) html += renderBag();

  const activeId = document.activeElement ? document.activeElement.id : null;
  const cursorPos = document.activeElement && document.activeElement.selectionStart;
  app.innerHTML = html;
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (cursorPos !== undefined && cursorPos !== null && el.setSelectionRange) try { el.setSelectionRange(cursorPos, cursorPos); } catch(e){} }
  }
}

function renderHome() {
  const products = STATE.products;
  const hero = products[0];
  const heroImg = hero ? thumb(hero.image) : '';
  const trending = products.slice(0, 8);
  const nikeImg = products.find(p => p.brand === 'Nike');
  const adidasImg = products.find(p => p.brand === 'adidas');
  const nbImg = products.find(p => p.brand === 'New Balance');

  return `<div>
    <div class="hero">
      ${hero ? `<img src="${heroImg}" alt="${hero.model}">` : ''}
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="sub">New in this week</div>
        <h1>Fresh<br>drops</h1>
        <p>${products.length} pairs photographed in-house and ready to ship. UK 4 to 12, nationwide delivery.</p>
        <div class="hero-btns">
          ${hero ? `<a class="btn-white" onclick="openProduct(${hero.id})">Shop the ${hero.model}</a>` : ''}
          <a class="btn-glass" onclick="go('list',{filter:'All'})">See everything</a>
        </div>
      </div>
    </div>

    <div class="banner">
      <b>Free 48-hour courier on orders over R2 500 — nationwide, tracked.</b>
      <a onclick="go('help')">How delivery works</a>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Shop by brand</h2>
        <a onclick="go('list',{filter:'All'})">View all</a>
      </div>
      <div class="grid-3">
        <a class="cat-card" onclick="go('list',{filter:'Nike'})">
          ${nikeImg ? `<img src="${thumb(nikeImg.image)}" alt="Nike" loading="lazy">` : ''}
          <span>Nike</span>
        </a>
        <a class="cat-card" onclick="go('list',{filter:'adidas'})">
          ${adidasImg ? `<img src="${thumb(adidasImg.image)}" alt="adidas" loading="lazy">` : ''}
          <span>adidas</span>
        </a>
        <a class="cat-card" onclick="go('list',{filter:'New Balance'})">
          ${nbImg ? `<img src="${thumb(nbImg.image)}" alt="New Balance" loading="lazy">` : ''}
          <span>New Balance</span>
        </a>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div>
          <h2>Trending in the room</h2>
          <p style="margin:8px 0 0;font-size:14px;color:#6E6C66">${trending.length} pairs photographed in-house this week.</p>
        </div>
        <a onclick="go('list',{filter:'All'})">Shop all</a>
      </div>
      <div class="grid-4">
        ${trending.map(p => tileHTML(p)).join('')}
      </div>
    </div>

    <div class="section">
      <div class="member-block">
        <div class="member-left">
          <div class="label">For members</div>
          <h2>First look at<br>every drop</h2>
          <p>Members see Thursday's pairs on Wednesday night and can hold a size before the site goes live. Free, no card needed.</p>
          <div style="display:flex;gap:10px;margin-top:24px">
            <a class="btn-lime" onclick="go('membership',{memberView:'join',memberDone:false})">Join free</a>
            <a class="btn-outline" onclick="go('membership',{memberView:'signin',memberDone:false})">Sign in</a>
          </div>
        </div>
        <div class="member-right">
          <div style="display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start">
            <span class="step-num">01</span>
            <div><div class="step-title">Reserve your size</div><p class="step-body">The size grid only shows what is physically in the room today.</p></div>
          </div>
          <div style="display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start">
            <span class="step-num">02</span>
            <div><div class="step-title">Order lands in WhatsApp</div><p class="step-body">Pre-typed with sizes, totals and a reference number.</p></div>
          </div>
          <div style="display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start">
            <span class="step-num">03</span>
            <div><div class="step-title">Pay however suits</div><p class="step-body">Card, instant EFT, or sort it out in the chat before anything ships.</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderList() {
  const list = filtered();
  const chips = ['All','Nike','adidas','New Balance','Puma','Men','Women','Reduced','Under R3 000','Sizes 9+'];
  const title = STATE.filter === 'All' ? 'New in' : STATE.filter;

  return `<div class="breadcrumb"><a onclick="go('home')">Home</a> / ${title}</div>
  <div class="list-head">
    <div>
      <h1>${title}</h1>
      <p style="margin:8px 0 0;font-size:14px;color:#6E6C66">${list.length} of ${STATE.products.length} pairs${STATE.query ? ` matching "${STATE.query}"` : ''}</p>
    </div>
    <div class="sort-wrap">
      <span>Sort</span>
      <select onchange="STATE.sort=this.value;render()">
        ${['Newest first','Price: low to high','Price: high to low'].map(o =>
          `<option${o === STATE.sort ? ' selected' : ''}>${o}</option>`
        ).join('')}
      </select>
    </div>
  </div>
  <div class="chips">
    ${chips.map(c => `<button class="chip${STATE.filter === c ? ' on' : ''}" onclick="STATE.filter='${c}';render()">${c}</button>`).join('')}
  </div>
  <div class="product-grid">
    ${list.map(p => tileHTML(p)).join('')}
  </div>
  ${list.length === 0 ? `<div class="empty-state">
    <h3>Nothing matches that yet</h3>
    <p>More pairs are in the room but not photographed yet. Ask in the chat and we will send a photo of the actual pair.</p>
    <button class="btn-full" style="width:auto;display:inline-block" onclick="STATE.filter='All';STATE.query='';render()">Clear filters</button>
  </div>` : ''}`;
}

function renderProduct() {
  const p = STATE.productDetail;
  if (!p) return '<div style="padding:80px 40px;text-align:center">Loading...</div>';

  const allSizes = [4,5,6,7,8,9,10,11,12];
  const tagColors = { 'Reduced': ['#E01E00','#fff'], 'Low stock': ['#E6FF00','#0E0E0E'] };
  const [tagBg, tagInk] = tagColors[p.tag] || ['#0E0E0E','#fff'];
  const priceColor = p.was ? '#E01E00' : '#0E0E0E';
  const mainImg = p.images[Math.min(STATE.shotIndex, p.images.length - 1)];
  const sub = subtotal();
  const related = STATE.products.filter(x => x.id !== p.id).slice(0, 4);

  const sizeHint = STATE.size
    ? `<span style="color:#1D7A3D">UK ${STATE.size} is in the room — we hold it for two hours once you add it.</span>`
    : (() => {
        const gone = allSizes.length - p.sizes.length;
        if (!gone) return 'Every UK size is in the room on this pair.';
        return `${gone} size${gone > 1 ? 's are' : ' is'} sold out. Crossed-out sizes are gone.`;
      })();

  return `<div class="pdp">
    <div style="font-size:14px;color:#8B8983"><a onclick="go('home')">Home</a> / <a onclick="go('list',{filter:'All'})">New in</a> / ${p.model}</div>
    <div class="pdp-grid">
      <div>
        <div class="pdp-hero">
          <img src="${thumb(mainImg)}" alt="${p.model}">
        </div>
        <div class="pdp-thumbs">
          ${p.images.map((img, i) => `<button class="pdp-thumb" style="border:2px solid ${i === STATE.shotIndex ? '#0E0E0E' : '#EDEDED'}" onclick="STATE.shotIndex=${i};render()">
            <img src="/img/thumb/${img}" alt="">
          </button>`).join('')}
        </div>
        <div class="pdp-notes">
          <div class="pdp-note">
            <h4>Shot in-house</h4>
            <p>${p.images.length > 1 ? p.images.length + ' angles of this exact pair.' : 'Photographed on the floor upstairs.'} The photo is the pair that arrives — no catalogue images.</p>
          </div>
          <div class="pdp-note">
            <h4>Fit &amp; sizing</h4>
            <p>UK sizing, true to size. Between sizes on this model, take the half size up.</p>
          </div>
        </div>
      </div>
      <div>
        <div class="pdp-brand">${p.brand}</div>
        <h1 class="pdp-model">${p.model}</h1>
        <div class="pdp-colorway">${p.colorway}</div>
        <div class="pdp-price">
          <span class="now" style="color:${priceColor}">${R(p.price)}</span>
          ${p.was ? `<span class="was">${R(p.was)}</span>` : ''}
          <span class="tag" style="background:${tagBg};color:${tagInk}">${p.tag}</span>
        </div>
        <div class="size-head">
          <span>Select your UK size</span>
          <a onclick="go('help')">Size guide</a>
        </div>
        <div class="size-grid">
          ${allSizes.map(n => {
            const has = p.sizes.includes(n);
            const on = STATE.size === n;
            return `<button class="size-btn${on ? ' on' : ''}${!has ? ' gone' : ''}" ${!has ? 'disabled' : ''} onclick="${has ? `STATE.size=${n};render()` : ''}">UK ${n}</button>`;
          }).join('')}
        </div>
        <div class="size-hint" style="color:${STATE.size ? '#1D7A3D' : '#6E6C66'}">${sizeHint}</div>
        <button class="btn-full" onclick="addToBag()">Add to bag</button>
        <button class="btn-full-outline" onclick="window.open('https://wa.me/27659662508?text=Hi%20Daylight!%20I%20have%20a%20question%20about%20the%20'+encodeURIComponent(p.brand+' '+p.model+' ('+p.colorway+')'),'_blank')">Ask about this pair on WhatsApp</button>
        <div class="facts">
          <div class="fact"><span class="k">Condition</span><span class="v">Brand new, in box</span></div>
          <div class="fact"><span class="k">Sizing</span><span class="v">UK, true to size</span></div>
          <div class="fact"><span class="k">Delivery</span><span class="v">${sub >= STATE.config.freeOver ? 'Free, 48 hours' : 'R' + STATE.config.courier + ', 48 hours'}</span></div>
          <div class="fact"><span class="k">Returns</span><span class="v">14 days, unworn</span></div>
        </div>
      </div>
    </div>
    <div class="section" style="padding-left:0;padding-right:0">
      <h2 style="margin:0 0 18px;font-family:'Archivo Black',Archivo,sans-serif;font-size:26px;letter-spacing:-.035em;text-transform:uppercase">Also in the room</h2>
      <div class="grid-4">
        ${related.map(p => tileHTML(p)).join('')}
      </div>
    </div>
  </div>`;
}

function renderCheckout() {
  const s = STATE;
  const sub = subtotal();
  const del = deliveryCost();
  const total = sub + del;
  const f = s.form;
  const e = s.errors;

  const field = (key, label, placeholder, span, tabIdx) => `<label class="form-label${span === 2 ? ' span-2' : ''}">
    <span>${label}</span>

async function lookupOrder() {
  const ref = STATE.trackRef.trim().toUpperCase();
  if (!ref) { STATE.trackNote = 'Enter a reference first.'; render(); return; }
  try {
    const res = await fetch(`/api/orders/${ref}`);
    if (!res.ok) {
      STATE.trackNote = 'No order under that reference yet. Check the confirmation message.';
      STATE.trackResult = null;
    } else {
      STATE.trackResult = await res.json();
      STATE.trackNote = 'Found it — status below is live.';
    }
  } catch {
    STATE.trackNote = 'Could not reach the server. Try again.';
  }
  render();
}

async function submitMembership() {
  const mf = STATE.memberForm;
  const isJoin = STATE.memberView === 'join';
  if (isJoin && !mf.name.trim()) { flash('Enter your name'); return; }
  if (!/[0-9]{9,}/.test(mf.phone.replace(/\D/g, ''))) { flash('Enter a valid mobile number'); return; }

  try {
    const res = await fetch('/api/members', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: mf.name, phone: mf.phone, email: mf.email, action: STATE.memberView })
    });
    const data = await res.json();
    if (!res.ok) { flash(data.error || 'Something went wrong'); return; }
    STATE.memberDone = true;
    if (data.waUrl) setTimeout(() => window.open(data.waUrl, '_blank'), 500);
    render();
  } catch (err) {
    flash('Network error — try again');
  }
}

// Hash routing
function handleHash() {
  const hash = location.hash.replace('#', '');
  if (!hash || hash === '/') go('home');
  else if (hash === 'shop') go('list', { filter: 'All' });
  else if (hash.startsWith('product/')) {
    const id = parseInt(hash.split('/')[1]);
    if (id) openProduct(id);
  }
  else if (hash === 'checkout') go('checkout');
  else if (hash.startsWith('confirm/')) {
    const ref = hash.split('/')[1];
    STATE.orderRef = ref;
    STATE.trackRef = ref;
    go('confirm');
  }
  else if (hash === 'track') go('track');
  else if (hash === 'help') go('help');
  else if (hash === 'membership') go('membership');
}

// Boot
(async () => {
  await Promise.all([loadProducts(), loadConfig()]);
  if (location.hash && location.hash !== '#') {
    handleHash();
  } else {
    render();
  }
  window.addEventListener('hashchange', handleHash);
})();
</script>
